services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - AGENT_API_KEY=${AGENT_API_KEY:-dev-key-123}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-10}
      - DAILY_BUDGET_USD=${DAILY_BUDGET_USD:-1.0}
      - MONTHLY_BUDGET_USD=${MONTHLY_BUDGET_USD:-10.0}
      - ENVIRONMENT=production
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
